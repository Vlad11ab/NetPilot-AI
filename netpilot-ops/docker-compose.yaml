services:
  mysql-server:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "4000:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    
  netpilot-api:
    image: vlad11ab/net-pilot-ai-api:0.2
    environment:
      DB_URL: "jdbc:mysql://mysql-server:3306/net_pilot_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true"
      DB_USER: root
      DB_PASSWORD: root
      SERVER_SERVLET_CONTEXT_PATH: /netpilot
    depends_on:
      mysql-server:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "9000:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - netpilot-api
    restart: unless-stopped

volumes:
  mysql_data:
